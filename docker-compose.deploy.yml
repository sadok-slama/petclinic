
services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: ${PETCLINIC_DB_PASSWORD:?Define PETCLINIC_DB_PASSWORD}
      POSTGRES_DB: petclinic
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 5

  petclinic:
    image: sadokslamaesprit/petclinic:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: ${PETCLINIC_DB_PASSWORD:?Define PETCLINIC_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
