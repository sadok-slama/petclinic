
name: PetClinic CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test application
        run: ./mvnw -B verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is empty"
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is empty"
            exit 1
          fi
          echo "Both Docker Hub secrets are available."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            sadokslamaesprit/petclinic:latest
            sadokslamaesprit/petclinic:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sadokslamaesprit/petclinic:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Push Docker image to Docker Hub
        run: |
          docker push sadokslamaesprit/petclinic:latest
          docker push sadokslamaesprit/petclinic:${{ github.sha }}
  

  deploy:
    name: Deploy to Ubuntu VM
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull image and deploy application
        env:
          IMAGE_TAG: ${{ github.sha }}
          PETCLINIC_DB_PASSWORD: ${{ secrets.PETCLINIC_DB_PASSWORD }}
        run: |
          docker compose \
            -f docker-compose.deploy.yml \
            pull

          docker compose \
            -f docker-compose.deploy.yml \
            up -d --remove-orphans

          docker compose \
            -f docker-compose.deploy.yml \
            ps
